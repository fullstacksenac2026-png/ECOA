{% extends "app-base.html" %}

{% block title %}Captura de Foto | ECOA{% endblock %}

{% block content %}
<main class="container py-4">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6 text-center">
            <h1 class="fw-bold mb-4">Captura de Denúncia</h1>

            <!-- Mode Selection -->
            <div class="btn-group w-100 mb-4" role="group" aria-label="Escolher modo">
                <input type="radio" class="btn-check" name="mode" id="camera-mode" autocomplete="off" checked>
                <label class="btn btn-outline-primary" for="camera-mode">
                    <i class="bi bi-camera-fill"></i> Tirar Foto
                </label>

                <input type="radio" class="btn-check" name="mode" id="upload-mode" autocomplete="off">
                <label class="btn btn-outline-primary" for="upload-mode">
                    <i class="bi bi-image"></i> Escolher do Dispositivo
                </label>
            </div>

            <form id="picture-form" method="POST" enctype="multipart/form-data" class="d-flex flex-column align-items-center">
                {% csrf_token %}

                <div id="location-status" class="alert alert-warning w-100 mb-3">
                    <i class="bi bi-geo-alt-fill"></i> Aguardando localização...
                </div>

                <!-- Camera Section -->
                <div id="camera-section" class="camera-container mb-4 position-relative shadow-lg rounded overflow-hidden bg-dark" style="width: 100%; max-width: 400px; aspect-ratio: 4/3;">
                    <video id="camera" autoplay playsinline class="w-100 h-100" style="object-fit: cover;"></video>
                    <canvas id="canvas" style="display: none;"></canvas>

                    <!-- Capture Button Overlay -->
                    <button type="button" onclick="window.takePicture()" class="btn btn-primary position-absolute bottom-0 start-50 translate-middle-x mb-3 rounded-circle shadow-lg" style="width: 70px; height: 70px; border: 4px solid white; z-index: 10;">
                        <i class="bi bi-camera-fill fs-2"></i>
                    </button>
                </div>

                <!-- Upload Section -->
                <div id="upload-section" class="mb-4" style="display: none; width: 100%; max-width: 400px;">
                    <div class="border border-2 border-dashed border-primary rounded p-4 text-center bg-light">
                        <i class="bi bi-cloud-upload fs-1 text-primary mb-3"></i>
                        <p class="mb-3">Clique para escolher uma imagem do seu dispositivo</p>
                        <input type="file" id="file-input" accept="image/*" class="form-control" style="display: none;">
                        <button type="button" onclick="document.getElementById('file-input').click()" class="btn btn-primary">
                            <i class="bi bi-folder-open"></i> Selecionar Imagem
                        </button>
                        <div id="image-preview" class="mt-3" style="display: none;">
                            <img id="preview-img" class="img-fluid rounded shadow" style="max-height: 300px;">
                        </div>
                    </div>
                </div>

                <!-- Hidden Inputs -->
                <input type="hidden" name="image" id="image_input">
                <input type="hidden" name="latitude" id="latitude">
                <input type="hidden" name="longitude" id="longitude">

                <!-- Map container -->
                <div id="map-container" style="display: none;" class="w-100 mb-4">
                    <div id="map" style="height: 200px; width: 100%;" class="rounded shadow-sm"></div>
                </div>

                <!-- Submit Button -->
                <button type="submit" id="submit-btn" class="btn btn-success btn-lg w-100 shadow-sm opacity-50" disabled>
                    <i class="bi bi-send-fill"></i> Enviar para Análise
                </button>
            </form>
        </div>
    </div>
</main>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        const video = document.getElementById('camera');
        const canvas = document.getElementById('canvas');
        const imageInput = document.getElementById('image_input');
        const locationStatus = document.getElementById('location-status');
        const submitBtn = document.getElementById('submit-btn');
        const latitudeInput = document.getElementById('latitude');
        const longitudeInput = document.getElementById('longitude');
        const cameraSection = document.getElementById('camera-section');
        const uploadSection = document.getElementById('upload-section');
        const fileInput = document.getElementById('file-input');
        const previewImg = document.getElementById('preview-img');
        const imagePreview = document.getElementById('image-preview');
        let mapInstance = null;
        let markerInstance = null;

        // Mode switching
        document.querySelectorAll('input[name="mode"]').forEach(radio => {
            radio.addEventListener('change', function() {
                if (this.id === 'camera-mode') {
                    cameraSection.style.display = 'block';
                    uploadSection.style.display = 'none';
                    initCamera();
                } else {
                    cameraSection.style.display = 'none';
                    uploadSection.style.display = 'block';
                    // Stop camera if running
                    if (video.srcObject) {
                        video.srcObject.getTracks().forEach(track => track.stop());
                    }
                }
                // Reset image input
                imageInput.value = '';
                submitBtn.disabled = true;
                submitBtn.classList.add('opacity-50');
                // Hide any preview
                const existingPreview = document.querySelector('.camera-preview-img');
                if (existingPreview) existingPreview.remove();
                imagePreview.style.display = 'none';
            });
        });

        // File input handling
        fileInput.addEventListener('change', function(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    imageInput.value = e.target.result;
                    previewImg.src = e.target.result;
                    imagePreview.style.display = 'block';
                    if (latitudeInput.value) {
                        submitBtn.disabled = false;
                        submitBtn.classList.remove('opacity-50');
                    }
                };
                reader.readAsDataURL(file);
            }
        });

        // Camera Activation
        function initCamera() {
            if (document.getElementById('camera-mode').checked) {
                try {
                    const stream = navigator.mediaDevices.getUserMedia({
                        video: { facingMode: 'environment', width: { ideal: 1280 }, height: { ideal: 720 } }
                    }).then(stream => {
                        video.srcObject = stream;
                    });
                } catch (err) {
                    locationStatus.classList.replace('alert-warning', 'alert-danger');
                    locationStatus.innerHTML = '<i class="bi bi-camera-video-off-fill"></i> Erro ao acessar câmera.';
                }
            }
        }

        // Geolocation Logic
        function initLocation() {
            if (navigator.geolocation) {
                navigator.geolocation.watchPosition(
                    (pos) => {
                        const { latitude, longitude } = pos.coords;
                        latitudeInput.value = latitude;
                        longitudeInput.value = longitude;

                        locationStatus.classList.remove('alert-warning', 'alert-danger');
                        locationStatus.classList.add('alert-success');
                        locationStatus.innerHTML = '<i class="bi bi-check-circle-fill"></i> Localização confirmada!';
                        
                        submitBtn.disabled = !imageInput.value;
                        if (!submitBtn.disabled) submitBtn.classList.remove('opacity-50');

                        updateMiniMap(latitude, longitude);
                    },
                    (err) => {
                        locationStatus.classList.replace('alert-warning', 'alert-danger');
                        locationStatus.innerHTML = '<i class="bi bi-exclamation-octagon-fill"></i> GPS Obrigatório para denúncia.';
                    },
                    { enableHighAccuracy: true }
                );
            }
        }

        function updateMiniMap(lat, lng) {
            document.getElementById('map-container').style.display = 'block';
            if (!mapInstance) {
                mapInstance = L.map('map').setView([lat, lng], 16);
                L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(mapInstance);
                markerInstance = L.marker([lat, lng]).addTo(mapInstance);
            } else {
                const newPos = [lat, lng];
                mapInstance.setView(newPos);
                markerInstance.setLatLng(newPos);
            }
        }

        window.takePicture = function() {
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            canvas.getContext('2d').drawImage(video, 0, 0);
            
            const dataUrl = canvas.toDataURL('image/jpeg', 0.8);
            imageInput.value = dataUrl;

            // Simple Preview
            let preview = document.querySelector('.camera-preview-img');
            if (!preview) {
                preview = document.createElement('img');
                preview.className = 'camera-preview-img img-fluid rounded mt-3 border shadow-sm';
                video.parentElement.after(preview);
            }
            preview.src = dataUrl;

            if (latitudeInput.value) {
                submitBtn.disabled = false;
                submitBtn.classList.remove('opacity-50');
            }
        };

        initCamera();
        initLocation();
    });
</script>
{% endblock %}
