{% extends "app-base.html" %}

{% block title %}Confirmar Exclusão - ECOÁ{% endblock %}

{% block content %}
<main class="w-full max-w-sm mx-auto px-4 min-h-[70vh] flex items-center justify-center">
    <div class="bg-white dark:bg-slate-800 border border-slate-100 dark:border-slate-700 shadow-2xl rounded-[3rem] p-10 text-center relative overflow-hidden w-full max-w-md">
        <!-- Background Decoration -->
        <div class="absolute top-0 inset-x-0 h-32 bg-gradient-to-b from-red-500/10 to-transparent"></div>
        
        <div class="relative z-10">
            <div class="w-24 h-24 bg-red-100 dark:bg-red-900/40 rounded-full flex mx-auto items-center justify-center mb-6 border-4 border-white dark:border-slate-800 shadow-md">
                <i class="bi bi-exclamation-triangle-fill text-red-500 text-5xl"></i>
            </div>
            
            <h2 class="text-3xl font-black text-slate-800 dark:text-white mb-3 tracking-tight">Tem certeza?</h2>
            <p class="text-slate-500 dark:text-slate-400 mb-10 text-lg leading-relaxed font-medium">
                Você está prestes a excluir a postagem <br><strong class="text-slate-700 dark:text-slate-200 block mt-2 text-xl px-4 py-2 bg-slate-50 dark:bg-slate-900 rounded-xl border border-slate-200 dark:border-slate-700">"{{ post.title }}"</strong><br> Esta ação não poderá ser desfeita.
            </p>

            <div class="flex flex-col gap-3">
                <form action="{% url 'forum:forum-post-delete' post.id %}" method="POST" class="w-full">
                    {% csrf_token %}
                    <button type="submit" class="w-full bg-red-500 hover:bg-red-600 text-white font-bold py-4 rounded-full shadow-[0_8px_20px_rgba(239,68,68,0.3)] hover:-translate-y-0.5 transition-all flex items-center justify-center gap-2">
                        <i class="bi bi-trash3-fill text-xl"></i> Excluir Agora
                    </button>
                </form>
                <a href="{% url 'forum:forum-post-detail' post.id %}" class="w-full bg-slate-100 dark:bg-slate-700 hover:bg-slate-200 dark:hover:bg-slate-600 text-slate-600 dark:text-slate-300 font-bold py-4 rounded-full transition-colors no-underline">
                    Cancelar
                </a>
            </div>
        </div>
    </div>
</main>
{% endblock %}
